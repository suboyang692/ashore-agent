name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 后端用例（LLM 打桩，不连 MySQL / Redis，不消耗 API 额度）
        env:
          # 模块导入期会构造 LLM 客户端，给个占位值即可；用例全程走 tests/stubs.py 的假模型
          DASHSCOPE_API_KEY: sk-ci-placeholder
        run: pytest

      - name: 前端渲染用例（从 web/index.html 抽取真实实现执行）
        run: node tests/js/test_render.js
